                if(project.hasProperty('meteorVideoTests')){vmArg '-Dverdania.meteorVideoTests=true';vmArg '-Dverdania.ffmpeg=' + file('../../work/video-tools/imageio_ffmpeg/binaries/ffmpeg-win-x86_64-v7.1.exe').absolutePath;}
                if(project.hasProperty('meteorVisualTests')){vmArg '-Dverdania.meteorVisualTests=true';programArg '--quickPlaySingleplayer';programArg 'Meteor-Video'}
                
                programArg '--width'; programArg (project.hasProperty('capturePanorama') ? '1024' : '1280')
                programArg '--height'; programArg (project.hasProperty('capturePanorama') ? '1024' : '720')
                if (project.hasProperty('recipesUiTests')) {
                    vmArg '-Dverdania.recipesUiTests=true'
                    programArg '--quickPlaySingleplayer'; programArg 'New World'
                }
                if (project.hasProperty('mobUiTests')) {
                    vmArg '-Dverdania.mobUiTests=true'
                    programArg '--quickPlaySingleplayer'; programArg 'New World'
                }
                if (project.hasProperty('capturePanorama')) {
                    vmArg '-Dverdania.capturePanorama=true'
                    programArg '--quickPlaySingleplayer'; programArg 'New World'
                }
                if (project.hasProperty('alienVisualTests')) {
                    vmArg '-Dverdania.exportAlienUvs=true'
                    programArg '--quickPlaySingleplayer'; programArg 'New World'
                }
                if(project.hasProperty('parasiteNetworkTests'))vmArg '-Dverdania.parasiteNetworkTests=true'
                if(project.hasProperty('walkTests'))vmArg '-Dverdania.walkTests=true'
            }
        }
        gameTest {
            server()
            name 'World Progression Game Tests'
            source sourceSets.gametest
            runDir testWorldDir
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath}"
        }
    }
}
tasks.named('runGameTest') {
    // oÏ‰o prompts even in GameTest's development launch. Decline the prompt;
    // the test harness does not require or change a production EULA agreement.
    standardInput = new ByteArrayInputStream('false\n'.getBytes('UTF-8'))
    doFirst {
        def directory = file(testWorldDir + '/config')
        directory.mkdirs()
        def propertiesFile = file(testWorldDir + '/server.properties')
        def serverProperties = new Properties()
        if (propertiesFile.exists()) propertiesFile.withInputStream { serverProperties.load(it) }
        serverProperties.setProperty('server-ip', '127.0.0.1')
        serverProperties.setProperty('server-port', '25599')
        propertiesFile.withOutputStream { serverProperties.store(it, 'Local automated game tests') }
        def destination = new File(directory, 'worldprogression.json')
        if (!destination.exists()) {
            def config = new groovy.json.JsonSlurper().parse(file('src/main/resources/worldprogression/default-config.json'))
            destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
        }
    }
}

