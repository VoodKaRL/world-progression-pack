    }
    runs {
        if (project.hasProperty('uiSmokeTests')) {
            client {
                source sourceSets.uitest
                runDir (project.hasProperty('meteorVisualTests') ? '../../work/gui-meteor-buried-v4' : '../../work/gui-v290-check')
                programArg '--username'; programArg 'MenuTest'
                if(project.hasProperty('journalUiTests')){vmArg '-Dverdania.journalUiTests=true';programArg '--quickPlaySingleplayer';programArg 'New World'}
                if(project.hasProperty('missionsUiTests')){vmArg '-Dverdania.missionsUiTests=true';programArg '--quickPlaySingleplayer';programArg 'New World'}
