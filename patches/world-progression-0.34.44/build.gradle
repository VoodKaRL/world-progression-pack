def uniqueProvider = file('../../work/providers/spookis-unique-mobs-0.9.1+1.21.1+fabric.jar')
def uniqueDev = layout.buildDirectory.file('provider-libraries/unique-mobs-dev-remap.jar').get().asFile
if (uniqueProvider.exists() && (!uniqueDev.exists() || uniqueProvider.lastModified() > uniqueDev.lastModified())) {
    uniqueDev.parentFile.mkdirs()
    def archive = new java.util.jar.JarFile(uniqueProvider)
    try {
        def manifest = new java.util.jar.Manifest(archive.manifest)
        manifest.mainAttributes.remove(new java.util.jar.Attributes.Name('Fabric-Loom-Version'))
        new java.util.jar.JarOutputStream(new FileOutputStream(uniqueDev), manifest).withCloseable { output ->
            archive.entries().each { entry ->
                if (entry.name.equalsIgnoreCase('META-INF/MANIFEST.MF')) return
                output.putNextEntry(new java.util.jar.JarEntry(entry))
                archive.getInputStream(entry).withCloseable { input -> input.transferTo(output) }
                output.closeEntry()
            }
        }
    } finally { archive.close() }
}

