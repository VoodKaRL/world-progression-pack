// Loom development runs do not discover libraries nested inside dependency JARs.
// Extract the exact bundled versions; production Fabric loads these from the providers.
configurations { providerBundles }
dependencies {
    modRuntimeOnly files("../verdania-harvest/build/libs/verdania-harvest-0.1.0-preview.11.jar")
    providerBundles 'maven.modrinth:mythicmetals:fKQ4feyG'
    providerBundles 'maven.modrinth:owo-lib:JB1fLQnc'
    if (project.hasProperty('wind34Visual')) providerBundles files('../../mods/yet_another_config_lib_v3-3.6.6+1.21.1-fabric.jar')
}
def bundledMods = []
def bundledLibraries = []
configurations.providerBundles.files.each { provider ->
    def archive = new java.util.zip.ZipFile(provider)
    try {
        def metadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(archive.getEntry('fabric.mod.json')))
        metadata.jars.each { nested ->
            if (new File(nested.file).name.startsWith('owo-sentinel-')) return
            def destination = layout.buildDirectory.file('provider-libraries/' + new File(nested.file).name).get().asFile
            destination.parentFile.mkdirs()
            destination.bytes = archive.getInputStream(archive.getEntry(nested.file)).bytes
            def nestedArchive = new java.util.zip.ZipFile(destination)
            try {
                (nestedArchive.getEntry('fabric.mod.json') != null ? bundledMods : bundledLibraries).add(destination)
            } finally { nestedArchive.close() }
        }
    } finally { archive.close() }
}

